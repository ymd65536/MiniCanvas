<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimum Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <main>
      <h1>Minimum Canvas</h1>
      <p>The Canvas Extension is running.</p>
      <p id="status" role="status">Waiting for JavaScript...</p>
      <button id="increment" type="button" disabled>Increment counter</button>
      <p>Count: <output id="counter" aria-live="polite">0</output></p>
      <noscript>Enable JavaScript to use the counter.</noscript>
    </main>
  </body>
</html>
